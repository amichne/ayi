[project]
name = "ayi"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "prompt-toolkit==3.0.52",
    "pydantic==2.12.3",
    "rich==14.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.14.0",
    "pyright[nodejs]==1.1.407",
    "pytest==8.4.2",
    "pyte==0.8.2",
]

[tool.uv]
package = false
no-build = true
compile-bytecode = true
system-certs = true
required-version = ">=0.12.9"
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["."]
exclude = ["**/fixtures", "**/.venv"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportUnusedCallResult = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py"]
extend-exclude = ["**/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# The terminal selection marker is intentionally distinct from ASCII >.
allowed-confusables = ["❯"]
# Documentation style is prose policy; formatter owns line layout. CLI output
# and explicit argv subprocesses are intentional at effect boundaries.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]
